intents:

  - name: junior-web-developer
    role: junior web / frontend developer
    keywords:
      - Web Developer
      - Frontend Developer
      - Junior Web Developer
      - WordPress Developer
    ai_search_hints:
      - junior web developer jobs Türkiye
      - frontend developer roles Türkiye