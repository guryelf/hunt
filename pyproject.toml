[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hunt"
version = "0.1.0"
description = "Local-first job hunt: AI-orchestrated search, deterministically enforced"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.13,<3",
    "pyyaml>=6.0,<7",
    "typer>=0.26,<1",
    "requests>=2.34,<3",
    "beautifulsoup4>=4.15,<5",
]

[project.scripts]
hunt = "hunt.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.15,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hunt"]

[tool.uv]
python-downloads = "automatic"
python-preference = "managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--tb=short"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E203", "E501"]
# Turkish keywords and fixtures legitimately use the dotless/dotted I.
# The verify/layout modules deliberately contain the full Unicode dash
# and quote inventory — they are the very characters those modules
# detect and fold.
allowed-confusables = [
  "ı",
  "İ",
  "–",  # en dash
  "—",  # em dash
  "‘",  # left single quote
  "’",  # right single quote
  "‒",  # figure dash
  "‐",  # hyphen
  "‑",  # non-breaking hyphen
  "−",  # minus sign
  " ",  # no-break space
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]